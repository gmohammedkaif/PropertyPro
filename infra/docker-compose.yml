# Local data services for PropertyPro development.

services:
  mongo:
    image: mongo:7
    container_name: propertypro-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: propertypro-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.9
    container_name: propertypro-search
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: '${MEILI_MASTER_KEY:-propertypro-dev-master-key}'
    volumes:
      - meili-data:/meili_data

  minio:
    image: minio/minio:latest
    container_name: propertypro-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:-propertypro}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-propertypro-secret}'
    volumes:
      - minio-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: propertypro-mail
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  mongo-data:
  redis-data:
  meili-data:
  minio-data:
